openapi: 3.0.1
info:
  title: "StrongAUTO api v1"
  version: 1.0.0

servers:
  - url: localhost:3000/api/v1
    description: Open API specification
  - url: strongauto.mk/api/v1
    description: Open API specification

paths:
  /vehicles/search:
    post:
      operationId: searchVehicleEntries
      tags:
        - Vehicle
      description: Get all vehicles pageable
      parameters:
        - $ref: "#/components/parameters/Accept-Language"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/Sort"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleFilters'
      responses:
        200:
          $ref: "#/components/responses/VehiclesResponse"

  /vehicles/{id}:
    get:
      operationId: getVehicleEntry
      tags:
        - Vehicle
      description: Get vehicle info
      parameters:
        - $ref: "#/components/parameters/Accept-Language"
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Id'
      responses:
        200:
          $ref: "#/components/responses/VehicleResponse"

  /vehicle-makes:
    get:
      operationId: getVehicleMakeEntries
      tags:
        - Vehicle
      description: Get all vehicle makes
      parameters:
        - $ref: "#/components/parameters/Accept-Language"
      responses:
        200:
          $ref: "#/components/responses/VehicleMakesResponse"
  /vehicle-makes/{make}:
    get:
      operationId: getVehicleMakeEntry
      tags:
        - Vehicle
      description: Get vehicle make with models
      parameters:
        - $ref: "#/components/parameters/Accept-Language"
        - in: path
          name: make
          required: true
          schema:
            $ref: "#/components/schemas/VehicleMakeValue"
      responses:
        200:
          $ref: "#/components/responses/VehicleMakeResponse"

components:
  schemas:
    Decimal:
      type: string
      format: decimal
      description: Decimal value
      example: '5.25'
    Year:
      type: integer
      format: int64
      description: year
      example: 2010

    Currency:
      type: string
      enum:
        - MKD
        - EUR
      example: "MKD"

    Amount:
      type: object
      properties:
        currency:
          $ref: "#/components/schemas/Currency"

    VehicleMakeValue:
      type: string
      example: 'Audi'
    VehicleModelValue:
      type: string
      example: 'B8'

    Id:
      type: string
      description: Primary key
      example: "0"
    VehicleCondition:
      type: string
      enum:
        - NEW
        - USED
      example: "NEW"
    VehicleBodyType:
      type: string
      enum:
        - SEDAN
        - COUPE
        - SUV
        - CONVERTIBLE
        - LIMOUSINE
      example: "SEDAN"
    VehicleTransmission:
      type: string
      enum:
        - AUTOMATIC
        - MANUAL
      example: "AUTOMATIC"
    VehicleDriveType:
      type: string
      enum:
        - AWD_4WD
        - 2WD_FWD
        - 2WD_RWD
      example: "AWD_4WD"
    VehicleFuelType:
      type: string
      enum:
        - DIESEL
        - PETROL
        - ELECTRIC
      example: "DIESEL"
    VehicleColor:
      type: string
      enum:
        - BLACK
        - WHITE
        - BLUE
        - GREEN
      example: "BLACK"
