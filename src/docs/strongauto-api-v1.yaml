    VehicleFilters:
      type: object
      properties:
        make:
          $ref: "#/components/schemas/VehicleMakeValue"
        model:
          $ref: "#/components/schemas/VehicleModelValue"
        price:
          type: string
          example: "0-1000"
        sold:
          type: boolean
          example: false
        featured:
          type: boolean
          example: true
        condition:
          $ref: "#/components/schemas/VehicleCondition"
        bodyTypes:
          type: array
          items:
            $ref: "#/components/schemas/VehicleBodyType"
        transmission:
          $ref: "#/components/schemas/VehicleTransmission"
        yearFrom:
          $ref: "#/components/schemas/Year"
        yearTo:
          $ref: "#/components/schemas/Year"
        mileageFrom:
          type: integer
          format: int64
          example: 100000
        mileageTo:
          type: integer
          format: int64
          example: 200000
        fuelType:
          $ref: "#/components/schemas/VehicleFuelType"
        color:
          $ref: "#/components/schemas/VehicleColor"
        features:
          type: array
          items:
            type: string
            example: "air_conditioner"

    VehicleAmount:
      allOf:
        - $ref: "#/components/schemas/Amount"
        - type: object
          required:
            - total
          properties:
            total:
              $ref: "#/components/schemas/Decimal"
            totalPromo:
              $ref: "#/components/schemas/Decimal"
            saving:
              $ref: "#/components/schemas/Decimal"

    VehicleState:
      type: string
      enum:
        - FEATURED
        - SOLD
      example: "SOLD"

    VehicleEmbedded:
      type: object
      description: Vehicle embedded data
      required:
        - id
        - state
        - amount
        - title
      properties:
        id:
          $ref: "#/components/schemas/Id"
        state:
          $ref: "#/components/schemas/VehicleState"
        images:
          type: array
          items:
            type: string
            example: 'image'
        make:
          type: string
          example: "Audi"
        model:
          type: string
          example: "B8"
        amount:
          $ref: "#/components/schemas/VehicleAmount"
        title:
          type: string
          description: Vehicle title
          example: "Audi RS7"
        description:
          type: string
          description: Vehicle description
          example: |
            - 2.0 TDI
            - 4 new tires
        summary:
          type: string
          description: Vehicle summary
          example: Audi A4 2.0TDI
        transmission:
          $ref: "#/components/schemas/VehicleTransmission"
        fuelType:
          $ref: "#/components/schemas/VehicleFuelType"
        mileage:
          type: integer
          example: 250000
        year:
          $ref: "#/components/schemas/Year"
        driveType:
          $ref: "#/components/schemas/VehicleDriveType"

    Vehicle:
      description: Vehicle full data
      allOf:
        - $ref: "#/components/schemas/VehicleEmbedded"
        - type: object
          properties:
            description:
              type: string
              description: Vehicle description
              example: |
                - 2.0 TDI
                - 4 new tires
            engineSize:
              type: string
              example: "2.0"
            doors:
              type: integer
              example: 4
            bodyType:
              $ref: "#/components/schemas/VehicleBodyType"
            condition:
              $ref: "#/components/schemas/VehicleCondition"
            color:
              $ref: "#/components/schemas/VehicleColor"
            features:
              type: array
              items:
                type: string
                example: "air_conditioner"

    VehicleModel:
      type: object
      required:
        - model
      properties:
        model:
          $ref: "#/components/schemas/VehicleModelValue"
    VehicleMakeEmbedded:
      type: object
      required:
        - make
      properties:
        make:
          $ref: "#/components/schemas/VehicleMakeValue"
    VehicleMake:
      allOf:
        - $ref: "#/components/schemas/VehicleMakeEmbedded"
        - type: object
          required:
            - models
          properties:
            models:
              type: array
              items:
                $ref: "#/components/schemas/VehicleModel"
    VehicleMakesResponse:
      type: object
      required:
        - makes
      properties:
        makes:
          type: array
          items:
            $ref: "#/components/schemas/VehicleMakeEmbedded"
    VehicleMakeResponse:
      $ref: '#/components/schemas/VehicleMake'

    VehiclesResponse:
      type: object
      required:
        - pageInfo
        - vehicles
      properties:
        info:
          $ref: "#/components/schemas/PageInfo"
        vehicles:
          type: array
          items:
            $ref: "#/components/schemas/VehicleEmbedded"

    VehicleResponse:
      $ref: "#/components/schemas/Vehicle"

    PageInfo:
      type: object
      description: Pagination info
      required:
        - totalPages
        - pageSize
        - pageNumber
      properties:
        totalPages:
          type: number
          example: 5
        pageSize:
          type: number
          example: 10
        pageNumber:
          type: number
          example: 10

  responses:
    VehicleMakesResponse:
      description: List of vehicle makes entries
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/VehicleMakesResponse"
    VehicleMakeResponse:
      description: Vehicle make info
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/VehicleMakeResponse"
    VehiclesResponse:
      description: A list of pageable vehicle entries
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/VehiclesResponse"
    VehicleResponse:
      description: Vehicle info
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/VehicleResponse"

  parameters:
    Page:
      in: query
      name: page
      description: Page number
      required: false
      schema:
        type: number
        example: 1
        default: 1
    Size:
      in: query
      name: size
      description: Page size
      required: false
      schema:
        type: number
        default: 10
        example: 10
    Sort:
      in: query
      name: sortBy
      description: Sort by properties
      required: false
      schema:
        type: array
        default: [ ]
        items:
          type: string
          example: "id=asc,title=desc"

    Accept-Language:
      name: Accept-Language
      in: header
      description: Accept language header
      example: "en"
      required: false
      schema:
        type: string



